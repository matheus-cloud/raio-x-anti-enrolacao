<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raio-X Anti-Enrolação</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; background: #1e293b; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; font-size: 24px; text-align: center; }
        textarea { width: 100%; height: 150px; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 4px; padding: 10px; margin-bottom: 10px; resize: none; font-size: 14px; box-sizing: border-box; }
        button { width: 100%; background: #22c55e; color: #fff; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #16a34a; }
        .resultado { margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 4px; border-left: 5px solid #38bdf8; display: none; }
        .bloco { margin-bottom: 10px; }
        .titulo-bloco { font-weight: bold; color: #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Raio-X Anti-Enrolação</h1>
        <p style="font-size: 14px; text-align: center; color: #94a3b8;">Cole o texto longo ou a questão confusa abaixo para focar na essência.</p>
        <textarea id="textoLongo" placeholder="Cole o texto aqui..."></textarea>
        <button onclick="analisarTexto()">Ativar Raio-X</button>
        
        <div id="resultadoRaioX" class="resultado">
            <div class="bloco"><span class="titulo-bloco">🎯 O Alvo:</span> <span id="resAlvo"></span></div>
            <hr style="border:0; border-top:1px solid #334155; margin:10px 0;">
            <div class="bloco"><span class="titulo-bloco">⚡ O Atalho (Essência):</span> <span id="resAtalho"></span></div>
            <hr style="border:0; border-top:1px solid #334155; margin:10px 0;">
            <div class="bloco"><span class="titulo-bloco">⚠️ A Armadilha (Ignorar):</span> <span id="resArmadilha"></span></div>
        </div>
    </div>

    <script>
        function analisarTexto() {
            const texto = document.getElementById('textoLongo').value;
            if(!texto.trim()) {
                alert('Cole algum texto primeiro!');
                return;
            }
            // Simulação cirúrgica do filtro para demonstração imediata
            document.getElementById('resAlvo').innerText = "Identificar o problema central exigido pelo comando.";
            document.getElementById('resAtalho').innerText = "Aplicar a norma direta, o protocolo rígido ou a causa e efeito inevitável.";
            document.getElementById('resArmadilha').innerText = "Desconsiderar enrolações, termos de distração e alternativas que sugerem adiar ou improvisar.";
            document.getElementById('resultadoRaioX').style.display = 'block';
        }
    </script>
</body>
</html>
